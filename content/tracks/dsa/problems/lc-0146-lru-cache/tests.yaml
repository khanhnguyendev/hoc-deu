signature:
  kind: design-class
  className: LRUCache
  constructor: { capacity: int }
  methods:
    get: { params: { key: int }, returns: int }
    put: { params: { key: int, value: int }, returns: void }
cases:
  - name: example-1
    ops: [LRUCache, put, put, get, put, get, put, get, get, get]
    args: [[2], [1, 1], [2, 2], [1], [3, 3], [2], [4, 4], [1], [3], [4]]
    expected: [null, null, null, 1, null, -1, null, -1, 3, 4]
  # capacity 1: every new key evicts the previous one
  - name: capacity-one
    ops: [LRUCache, put, get, put, get, get]
    args: [[1], [2, 1], [2], [3, 2], [2], [3]]
    expected: [null, null, 1, null, -1, 2]
  # put on an existing key updates it and makes it the most recent: key 2 is evicted, not key 1
  - name: update-refreshes
    ops: [LRUCache, put, put, put, put, get, get, get]
    args: [[2], [1, 1], [2, 2], [1, 10], [3, 3], [1], [2], [3]]
    expected: [null, null, null, null, null, 10, -1, 3]
  - name: get-missing
    ops: [LRUCache, get, put, get, get]
    args: [[2], [0], [0, 0], [0], [10000]]
    expected: [null, -1, null, 0, -1]
  # get makes a key the most recent: key 2 is evicted on the third put
  - name: get-refreshes
    ops: [LRUCache, put, put, get, put, get, get, get]
    args: [[2], [1, 100000], [2, 2], [1], [3, 3], [2], [1], [3]]
    expected: [null, null, null, 100000, null, -1, 100000, 3]
