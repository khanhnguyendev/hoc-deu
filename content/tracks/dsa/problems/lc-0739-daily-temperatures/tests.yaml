signature:
  { kind: function, name: dailyTemperatures, params: { temperatures: 'int[]' }, returns: 'int[]' }
cases:
  - name: example-1
    input: { temperatures: [73, 74, 75, 71, 69, 72, 76, 73] }
    expected: [1, 1, 4, 2, 1, 1, 0, 0]
  - { name: example-2, input: { temperatures: [30, 40, 50, 60] }, expected: [1, 1, 1, 0] }
  - { name: example-3, input: { temperatures: [30, 60, 90] }, expected: [1, 1, 0] }
  - { name: single-element, input: { temperatures: [50] }, expected: [0] }
  - name: strictly-decreasing
    input: { temperatures: [100, 90, 80, 30] }
    expected: [0, 0, 0, 0]
  # an equal temperature is not warmer
  - { name: all-duplicates, input: { temperatures: [70, 70, 70] }, expected: [0, 0, 0] }
  - name: mixed
    input: { temperatures: [55, 38, 53, 81, 61, 93, 97, 32, 43, 78] }
    expected: [3, 1, 1, 2, 1, 1, 0, 1, 1, 0]
