signature:
  { kind: function, name: topKFrequent, params: { nums: 'int[]', k: int }, returns: 'int[]' }
compare: unordered
cases:
  - { name: example-1, input: { nums: [1, 1, 1, 2, 2, 3], k: 2 }, expected: [1, 2] }
  - { name: example-2, input: { nums: [1], k: 1 }, expected: [1] }
  - { name: example-3, input: { nums: [1, 2, 1, 2, 1, 2, 3, 1, 3, 2], k: 2 }, expected: [1, 2] }
  - { name: negatives, input: { nums: [-1, -1, -2, -2, -2, 3], k: 1 }, expected: [-2] }
  - { name: every-element, input: { nums: [4, 5, 6], k: 3 }, expected: [4, 5, 6] }
  - {
      name: extremes,
      input: { nums: [-10000, 10000, 10000, -10000, -10000, 0], k: 2 },
      expected: [-10000, 10000],
    }
