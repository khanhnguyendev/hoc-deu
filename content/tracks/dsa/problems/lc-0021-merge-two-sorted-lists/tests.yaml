signature:
  kind: linked-list
  name: mergeTwoLists
  params: { list1: ListNode, list2: ListNode }
  returns: ListNode
cases:
  - { name: example-1, input: { list1: [1, 2, 4], list2: [1, 3, 4] }, expected: [1, 1, 2, 3, 4, 4] }
  - { name: example-2, input: { list1: [], list2: [] }, expected: [] }
  - { name: example-3, input: { list1: [], list2: [0] }, expected: [0] }
  - { name: second-empty, input: { list1: [-100, 100], list2: [] }, expected: [-100, 100] }
  - { name: negatives, input: { list1: [-3, 5], list2: [-4, -3] }, expected: [-4, -3, -3, 5] }
  # every node of list1 comes before list2: the loop ends with list2 still whole
  - { name: disjoint-ranges, input: { list1: [1, 2, 3], list2: [7, 8] }, expected: [1, 2, 3, 7, 8] }
