# Any order of triplets, and of the numbers inside a triplet, is accepted.
signature: { kind: function, name: threeSum, params: { nums: 'int[]' }, returns: 'int[][]' }
compare: unordered-nested
cases:
  - name: example-1
    input: { nums: [-1, 0, 1, 2, -1, -4] }
    expected: [[-1, -1, 2], [-1, 0, 1]]
  - { name: example-2, input: { nums: [0, 1, 1] }, expected: [] }
  - { name: example-3, input: { nums: [0, 0, 0] }, expected: [[0, 0, 0]] }
  - { name: many-zeros, input: { nums: [0, 0, 0, 0] }, expected: [[0, 0, 0]] }
  - { name: duplicate-triplets, input: { nums: [-2, 0, 0, 2, 2] }, expected: [[-2, 0, 2]] }
  - { name: no-triplet, input: { nums: [1, 2, -2, -1] }, expected: [] }
  - name: several-triplets-with-duplicates
    input: { nums: [-4, -2, -2, -2, 0, 1, 2, 2, 2, 3, 3, 4, 4, 6, 6] }
    expected: [[-4, -2, 6], [-4, 0, 4], [-4, 1, 3], [-4, 2, 2], [-2, -2, 4], [-2, 0, 2]]
