signature: { kind: tree, name: isSameTree, params: { p: TreeNode, q: TreeNode }, returns: bool }
cases:
  - { name: example-1, input: { p: [1, 2, 3], q: [1, 2, 3] }, expected: true }
  - { name: example-2, input: { p: [1, 2], q: [1, null, 2] }, expected: false }
  - { name: example-3, input: { p: [1, 2, 1], q: [1, 1, 2] }, expected: false }
  - { name: both-empty, input: { p: [], q: [] }, expected: true }
  - { name: one-empty, input: { p: [1], q: [] }, expected: false }
  - {
      name: deep-equal,
      input: { p: [1, 2, 3, 4, null, null, 5], q: [1, 2, 3, 4, null, null, 5] },
      expected: true,
    }
  - {
      name: deep-value-differs,
      input: { p: [1, 2, 3, 4, null, null, 5], q: [1, 2, 3, 4, null, null, -5] },
      expected: false,
    }
