signature:
  kind: linked-list
  name: removeNthFromEnd
  params: { head: ListNode, n: int }
  returns: ListNode
cases:
  - { name: example-1, input: { head: [1, 2, 3, 4, 5], n: 2 }, expected: [1, 2, 3, 5] }
  - { name: example-2, input: { head: [1], n: 1 }, expected: [] }
  - { name: example-3, input: { head: [1, 2], n: 1 }, expected: [1] }
  # n equals the length: the head itself goes
  - { name: remove-head, input: { head: [1, 2, 3], n: 3 }, expected: [2, 3] }
  - { name: remove-tail, input: { head: [0, 100, 50], n: 1 }, expected: [0, 100] }
  - { name: duplicates, input: { head: [4, 4, 4, 4], n: 2 }, expected: [4, 4, 4] }
