signature: { kind: function, name: findMin, params: { nums: 'int[]' }, returns: int }
cases:
  - { name: example-1, input: { nums: [3, 4, 5, 1, 2] }, expected: 1 }
  - { name: example-2, input: { nums: [4, 5, 6, 7, 0, 1, 2] }, expected: 0 }
  - { name: example-3, input: { nums: [11, 13, 15, 17] }, expected: 11 }
  - { name: single-element, input: { nums: [7] }, expected: 7 }
  - { name: two-elements, input: { nums: [2, 1] }, expected: 1 }
  # [-5000, -1, 0, 3, 5000] rotated once
  - { name: rotated-once, input: { nums: [5000, -5000, -1, 0, 3] }, expected: -5000 }
  # [1, 2, 3, 4, 5] rotated n - 1 times
  - { name: min-at-end, input: { nums: [2, 3, 4, 5, 1] }, expected: 1 }
  # [1, 2, 3] rotated once: the minimum is mid itself, so hi must stay at mid
  - { name: min-in-middle, input: { nums: [3, 1, 2] }, expected: 1 }
