signature:
  kind: design-class
  className: KthLargest
  constructor: { k: int, nums: 'int[]' }
  methods:
    add: { params: { val: int }, returns: int }
cases:
  - name: example-1
    ops: [KthLargest, add, add, add, add, add]
    args: [[3, [4, 5, 8, 2]], [3], [5], [10], [9], [4]]
    expected: [null, 4, 5, 5, 8, 8]
  - name: example-2
    ops: [KthLargest, add, add, add, add]
    args: [[4, [7, 7, 7, 7, 8, 3]], [2], [10], [9], [9]]
    expected: [null, 7, 7, 7, 8]
  # the stream starts empty: with k = 1 every add returns the largest value so far
  - name: empty-start-k-1
    ops: [KthLargest, add, add, add]
    args: [[1, []], [-3], [-5], [10]]
    expected: [null, -3, -3, 10]
  # the stream starts one value short of k: the first add fills the heap to k
  - name: one-short-of-k
    ops: [KthLargest, add, add, add]
    args: [[2, [0]], [-1], [1], [-2]]
    expected: [null, -1, 0, 0]
  # values at the constraint bounds, with duplicates of the k-th largest
  - name: bounds-and-duplicates
    ops: [KthLargest, add, add, add]
    args: [[3, [10000, -10000, 10000]], [-10000], [10000], [5]]
    expected: [null, -10000, 10000, 10000]
