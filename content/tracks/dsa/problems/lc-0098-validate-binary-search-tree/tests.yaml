signature: { kind: tree, name: isValidBST, params: { root: TreeNode }, returns: bool }
cases:
  - { name: example-1, input: { root: [2, 1, 3] }, expected: true }
  - { name: example-2, input: { root: [5, 1, 4, null, null, 3, 6] }, expected: false }
  - { name: single-node, input: { root: [0] }, expected: true }
  - { name: duplicates, input: { root: [2, 2, 2] }, expected: false }
  - {
      name: grandchild-breaks-root-bound,
      input: { root: [5, 4, 6, null, null, 3, 7] },
      expected: false,
    }
  - { name: equal-to-ancestor, input: { root: [3, 1, 5, null, 3] }, expected: false }
  - { name: int-extremes, input: { root: [-2147483648, null, 2147483647] }, expected: true }
