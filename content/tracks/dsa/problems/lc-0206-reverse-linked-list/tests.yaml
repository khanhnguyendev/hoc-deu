  - { name: example-2, input: { head: [1, 2] }, expected: [2, 1] }
  - { name: example-3, input: { head: [] }, expected: [] }
  - { name: single-node, input: { head: [-5000] }, expected: [-5000] }
  - { name: duplicates, input: { head: [3, 3, 1, 3] }, expected: [3, 1, 3, 3] }
  - { name: odd-length, input: { head: [5000, 0, -1] }, expected: [-1, 0, 5000] }
