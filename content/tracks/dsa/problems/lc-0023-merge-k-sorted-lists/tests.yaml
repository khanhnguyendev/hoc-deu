signature:
  { kind: linked-list, name: mergeKLists, params: { lists: 'ListNode[]' }, returns: ListNode }
cases:
  - name: example-1
    input: { lists: [[1, 4, 5], [1, 3, 4], [2, 6]] }
    expected: [1, 1, 2, 3, 4, 4, 5, 6]
  - { name: example-2, input: { lists: [] }, expected: [] }
  - { name: example-3, input: { lists: [[]] }, expected: [] }
  - { name: some-empty, input: { lists: [[], [2], [1, 3], []] }, expected: [1, 2, 3] }
  - { name: single-list, input: { lists: [[-10000, 0, 10000]] }, expected: [-10000, 0, 10000] }
  - name: duplicates-and-negatives
    input: { lists: [[-2, -2, 5], [-2, 0], [-3], [5, 5]] }
    expected: [-3, -2, -2, -2, 0, 5, 5, 5]
