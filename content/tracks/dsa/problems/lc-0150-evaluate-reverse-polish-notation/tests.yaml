signature: { kind: function, name: evalRPN, params: { tokens: 'string[]' }, returns: int }
cases:
  - { name: example-1, input: { tokens: ['2', '1', '+', '3', '*'] }, expected: 9 }
  - { name: example-2, input: { tokens: ['4', '13', '5', '/', '+'] }, expected: 6 }
  - name: example-3
    input: { tokens: ['10', '6', '9', '3', '+', '-11', '*', '/', '*', '17', '+', '5', '+'] }
    expected: 22
  - { name: single-number, input: { tokens: ['-200'] }, expected: -200 }
  # 20 / 4 = 5, then 5 - 3 = 2: the first popped value is the right operand
  - { name: operand-order, input: { tokens: ['20', '4', '/', '3', '-'] }, expected: 2 }
  # division truncates toward zero: -7 / 2 = -3 (not -4)
  - { name: negative-division, input: { tokens: ['-7', '2', '/'] }, expected: -3 }
  - { name: negative-divisor, input: { tokens: ['7', '-2', '/'] }, expected: -3 }
