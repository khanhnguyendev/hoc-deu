signature: { kind: function, name: findKthLargest, params: { nums: 'int[]', k: int }, returns: int }
compare: exact
cases:
  - { name: example-1, input: { nums: [3, 2, 1, 5, 6, 4], k: 2 }, expected: 5 }
  - { name: example-2, input: { nums: [3, 2, 3, 1, 2, 4, 5, 5, 6], k: 4 }, expected: 4 }
  - { name: single-element, input: { nums: [-7], k: 1 }, expected: -7 }
  - { name: all-duplicates, input: { nums: [2, 2, 2, 2], k: 3 }, expected: 2 }
  # k equals n: the smallest value, here negative
  - { name: k-equals-n, input: { nums: [-1, -10000, 10000, 0], k: 4 }, expected: -10000 }
