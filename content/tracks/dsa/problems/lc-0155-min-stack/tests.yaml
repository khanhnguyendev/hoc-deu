signature:
  kind: design-class
  className: MinStack
  methods:
    push: { params: { val: int }, returns: void }
    pop: { returns: void }
    top: { returns: int }
    getMin: { returns: int }
cases:
  - name: example-1
    ops: [MinStack, push, push, push, getMin, pop, top, getMin]
    args: [[], [-2], [0], [-3], [], [], [], []]
    expected: [null, null, null, null, -3, null, 0, -2]
  # the minimum 0 is pushed twice: popping one copy must keep 0 as the minimum
  - name: equal-minimums
    ops: [MinStack, push, push, push, getMin, pop, getMin]
    args: [[], [0], [1], [0], [], [], []]
    expected: [null, null, null, null, 0, null, 0]
  - name: single-element
    ops: [MinStack, push, top, getMin]
    args: [[], [-2147483648], [], []]
    expected: [null, null, -2147483648, -2147483648]
  # popping the minimum restores the previous one
  - name: pop-restores-min
    ops: [MinStack, push, push, getMin, pop, getMin, top]
    args: [[], [3], [1], [], [], [], []]
    expected: [null, null, null, 1, null, 3, 3]
  # the int extremes: a minimum kept as a difference (val - min) overflows a 32-bit int
  - name: int-extremes
    ops: [MinStack, push, push, getMin, pop, getMin]
    args: [[], [2147483647], [-2147483648], [], [], []]
    expected: [null, null, null, -2147483648, null, 2147483647]
