signature: { kind: function, name: containsDuplicate, params: { nums: 'int[]' }, returns: bool }
compare: exact
cases:
  - { name: example-1, input: { nums: [1, 2, 3, 1] }, expected: true }
  - { name: example-2, input: { nums: [1, 2, 3, 4] }, expected: false }
  - { name: example-3, input: { nums: [1, 1, 1, 3, 3, 4, 3, 2, 4, 2] }, expected: true }
  - { name: single-element, input: { nums: [7] }, expected: false }
  - { name: distinct-negatives, input: { nums: [-3, -2, -1, 0] }, expected: false }
  - {
      name: extremes-repeated,
      input: { nums: [-1000000000, 0, 1000000000, -1000000000] },
      expected: true,
    }
