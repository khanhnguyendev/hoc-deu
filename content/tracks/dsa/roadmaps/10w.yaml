# The DSA 10-week roadmap (platform design §3.4, §5.3; task 3.6).
# core and recap are the input of the §5.10/§5.11 simulation (plan-sim.py W10), pinned by
# tools/content/dsa-content.test.ts. A recap entry without a mode introduces its problem.
# bonus: the selected NeetCode 150 problems (decision 29, Q2), each in its topic's week.
