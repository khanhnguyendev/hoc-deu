# content-verify fixture: a design class run as an operation sequence (M3c) — decode receives
# encode's result ({ $result: 1 }), the encoded form is not compared ({ $any: true }), and Java
# takes and returns the List<String> LeetCode declares.
signature:
  kind: design-class
  className: Codec
  methods:
    encode: { params: { strs: 'string[]' }, returns: string }
    decode: { params: { s: string }, returns: 'string[]' }
cases:
  - name: example-1
    ops: [Codec, encode, decode]
    args: [[], [[Hello, World]], [{ $result: 1 }]]
    expected: [null, { $any: true }, [Hello, World]]
  - name: empty-string
    ops: [Codec, encode, decode]
    args: [[], [['']], [{ $result: 1 }]]
    expected: [null, { $any: true }, ['']]
  - name: no-strings
    ops: [Codec, encode, decode]
    args: [[], [[]], [{ $result: 1 }]]
    expected: [null, '', []]
  - name: two-round-trips
    ops: [Codec, encode, encode, decode, decode]
    args: [[], [['a#1']], [['', '#']], [{ $result: 2 }], [{ $result: 1 }]]
    expected: [null, { $any: true }, { $any: true }, ['', '#'], ['a#1']]
