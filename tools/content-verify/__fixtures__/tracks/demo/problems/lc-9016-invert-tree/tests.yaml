# content-verify fixture: a level-order tree in and out, null gaps and the empty tree included.
signature: { kind: tree, name: invertTree, params: { root: TreeNode }, returns: TreeNode }
cases:
  - { name: example-1, input: { root: [4, 2, 7, 1, 3, 6, 9] }, expected: [4, 7, 2, 9, 6, 3, 1] }
  - { name: example-2, input: { root: [2, 1, 3] }, expected: [2, 3, 1] }
  - { name: example-3, input: { root: [] }, expected: [] }
  - { name: null-gaps, input: { root: [1, 2, null, 3] }, expected: [1, null, 2, null, 3] }
  - { name: right-spine, input: { root: [1, null, 2, null, 3] }, expected: [1, 2, null, 3] }
