# content-verify fixture: two linked lists in, one out (the result splices the input nodes).
signature:
  kind: linked-list
  name: mergeTwoLists
  params: { list1: ListNode, list2: ListNode }
  returns: ListNode
cases:
  - { name: example-1, input: { list1: [1, 2, 4], list2: [1, 3, 4] }, expected: [1, 1, 2, 3, 4, 4] }
  - { name: example-2, input: { list1: [], list2: [] }, expected: [] }
  - { name: example-3, input: { list1: [], list2: [0] }, expected: [0] }
  - { name: negatives, input: { list1: [-3, 5], list2: [-4] }, expected: [-4, -3, 5] }
  - { name: one-sided, input: { list1: [1, 2], list2: [] }, expected: [1, 2] }
