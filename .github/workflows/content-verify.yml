name: content-verify

# Runs every solution against its tests.yaml (platform design §3.7, ADR-0012). A required check, so
# it always runs: the path check lives inside the job (a workflow-level path filter would leave the
# check pending), and every step after it carries the same `if:`. The path list covers everything
# tools/content-verify imports (pinned by tools/content-verify/workflow.test.ts).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: content-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  content-verify:
    name: content-verify
    # Pinned: newer images swap /usr/bin tools (sudo-rs, uutils) that the sandbox relies on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: paths
        name: Content or harness changed? (in-job check keeps this required check reporting)
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
             || ! git diff --quiet "$BASE" HEAD -- content tools/content-verify lib/content/schemas \
                  lib/content/verification.ts lib/domain/settings.ts package.json pnpm-lock.yaml \
                  pnpm-workspace.yaml tsconfig.json vitest.config.ts .nvmrc \
                  .github/workflows/content-verify.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No content or harness change — nothing to verify."
          fi

      # The runner's own temp files go to RUNNER_TEMP, not the /tmp the sandbox user shares. (Job-level
      # `env` cannot read the runner context, so this goes through GITHUB_ENV.)
      - if: steps.paths.outputs.run == 'true'
        name: Runner temp off the shared /tmp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - if: steps.paths.outputs.run == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.paths.outputs.run == 'true'
        uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - if: steps.paths.outputs.run == 'true'
        uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '25' }
      - if: steps.paths.outputs.run == 'true'
        uses: actions/setup-go@v7
        with: { go-version: '1.26', cache: false }
      - if: steps.paths.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.paths.outputs.run == 'true'
        name: Sandbox user without network (OD2)
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin cvsandbox
          id cvsandbox
          if [ "$(id -Gn cvsandbox)" != "$(id -gn cvsandbox)" ]; then
            echo "::error::cvsandbox has supplementary groups: $(id -Gn cvsandbox)"; exit 1
          fi
          # No cron or at jobs: a scheduled process would outlive every pkill.
          echo cvsandbox | sudo tee -a /etc/cron.deny /etc/at.deny > /dev/null
          sudo iptables -I OUTPUT -m owner --uid-owner cvsandbox -j REJECT
          sudo ip6tables -I OUTPUT -m owner --uid-owner cvsandbox -j REJECT
          # No way around the packet filter through local sockets: systemd-resolved (varlink and
          # D-Bus), nscd, and snapd (0666, reaches the snap store).
          for socket_path in /run/systemd/resolve /run/dbus/system_bus_socket /run/nscd/socket \
                             /run/snapd.socket /run/snapd-snap.socket; do
            if sudo test -e "$socket_path"; then
              sudo setfacl -m u:cvsandbox:--- "$socket_path"
              sudo getfacl -p "$socket_path"
            fi
          done
          # Nothing the runner executes after sandboxed code may be writable by the sandbox user.
          sudo chmod -R o-w /opt/hostedtoolcache
          IFS=: read -r -a path_dirs <<< "$PATH"
          existing=()
          for dir in "${path_dirs[@]}"; do
            if [ -d "$dir" ]; then sudo chmod o-w "$dir"; existing+=("$dir"); fi
          done
          # For the record.
          sudo iptables -S OUTPUT | sed -n 1,3p
          sudo ip6tables -S OUTPUT | sed -n 1,3p
          stat -c '%A %U:%G %n' / /opt /opt/hostedtoolcache "${existing[@]}"
          sysctl fs.protected_hardlinks fs.protected_symlinks fs.protected_regular

      - if: steps.paths.outputs.run == 'true'
        name: 'Sandbox audit: nothing the runner executes is writable by the sandbox user'
        shell: bash
        run: |
          set -euo pipefail
          # Every PATH dir (a missing one: its nearest existing parent), /opt, /usr/local, /home and
          # /etc, symlink chains included; positive controls inside (user, /tmp, entry count).
          started=$SECONDS
          status=0
          (cd / && sudo -n -u cvsandbox -- /usr/bin/python3 -I -B - --user cvsandbox --path "$PATH" \
            /opt /usr/local /home /etc) < tools/content-verify/sandbox_audit.py || status=$?
          echo "Audit took $((SECONDS - started)) s."
          case "$status" in
            0) ;;
            1) echo "::error::the sandbox user can write where the runner executes from (above)"; exit 1 ;;
            *) echo "::error::the sandbox audit is broken (exit $status): it proved nothing"; exit 1 ;;
          esac

      - if: steps.paths.outputs.run == 'true'
        name: Sandbox self-test (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python3)"
          as_sandbox() { (cd / && sudo -n -u cvsandbox -- "$@"); }
          # The sandbox user can run every toolchain.
          as_sandbox "$PY" -c 'print(1)'
          as_sandbox "$(command -v javac)" -version
          as_sandbox "$(command -v java)" -version
          as_sandbox /usr/bin/env -i HOME=/tmp GOENV=off "$(command -v go)" version
          # The runner itself has network, so the checks below cannot pass vacuously.
          curl -sSf -o /dev/null --max-time 10 https://example.com
          IP="$(getent ahostsv4 example.com | awk 'NR == 1 { print $1 }')"
          test -n "$IP"
          # No name resolution: not over port 53, systemd-resolved's varlink socket or D-Bus.
          as_sandbox "$PY" -c '
          import socket
          try:
              socket.getaddrinfo("example.com", 443)
          except socket.gaierror as error:
              print("DNS blocked:", error)
          else:
              raise SystemExit("::error::the sandbox user resolved example.com")'
          # No connection by address…
          as_sandbox "$PY" -c "
          import errno, socket
          try:
              socket.create_connection(('$IP', 443), timeout=5)
          except ConnectionRefusedError as error:
              assert error.errno == errno.ECONNREFUSED, error
              print('raw IP blocked:', error)
          else:
              raise SystemExit('::error::the sandbox user reached $IP')"
          # …and none on loopback.
          "$PY" -m http.server 18080 --bind 127.0.0.1 > /dev/null 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2> /dev/null || true' EXIT
          for _ in $(seq 50); do curl -sf -o /dev/null http://127.0.0.1:18080/ && break; sleep 0.1; done
          curl -sSf -o /dev/null --max-time 5 http://127.0.0.1:18080/
          as_sandbox "$PY" -c "
          import errno, socket
          try:
              socket.create_connection(('127.0.0.1', 18080), timeout=5)
          except ConnectionRefusedError as error:
              assert error.errno == errno.ECONNREFUSED, error
              print('loopback blocked:', error)
          else:
              raise SystemExit('::error::the sandbox user reached loopback')"
          # No local socket leads out either: name service, D-Bus, docker and snapd all refuse it.
          sockets=()
          for socket_path in /run/systemd/resolve/io.systemd.Resolve /run/dbus/system_bus_socket \
                             /var/run/docker.sock /run/snapd.socket /run/snapd-snap.socket \
                             /run/nscd/socket; do
            if sudo test -S "$socket_path"; then sockets+=("$socket_path"); fi
          done
          echo "Unix sockets to check: ${sockets[*]:-none}"
          if [ "${#sockets[@]}" -gt 0 ]; then
            as_sandbox "$PY" -c '
          import socket, sys
          for path in sys.argv[1:]:
              client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              try:
                  client.connect(path)
              except PermissionError as error:
                  print("refused:", path, error)
              else:
                  raise SystemExit(f"::error::the sandbox user connected to {path}")
              finally:
                  client.close()' "${sockets[@]}"
          fi

      - if: steps.paths.outputs.run == 'true'
        name: CLI refuses to run unsandboxed (exit 2)
        shell: bash
        run: |
          set -euo pipefail
          # An empty root: even if the refusal ever broke, there would be no solution to run.
          mkdir -p "$RUNNER_TEMP/cv-empty"
          status=0
          output="$(pnpm -s content:verify --root "$RUNNER_TEMP/cv-empty" 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 2 ] || ! grep -q 'refusing to run solutions unsandboxed' <<< "$output"; then
            echo "::error::content:verify without a sandbox user must refuse with exit 2 (got $status)"
            exit 1
          fi

      - if: steps.paths.outputs.run == 'true'
        name: Harness self-test on fixtures
        shell: bash
        env: { CONTENT_VERIFY_INTEGRATION: '1', CONTENT_VERIFY_SANDBOX_USER: cvsandbox }
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/integration.json"
          pnpm vitest run tools/content-verify/integration.test.ts \
            --reporter=default --reporter=json --outputFile.json="$report"
          # vitest exits 0 when every test is skipped: require that they all ran and passed.
          node -e '
          const r = require(process.argv[1])
          console.log(`passed ${r.numPassedTests} · failed ${r.numFailedTests} · skipped ${r.numPendingTests}`)
          if (!r.success || r.numPassedTests === 0 || r.numFailedTests > 0 || r.numPendingTests > 0) {
            console.log("::error::the harness self-test did not run every test")
            process.exit(1)
          }' "$report"

      - if: steps.paths.outputs.run == 'true'
        name: No sandbox process survived the harness self-test
        shell: bash
        run: |
          set -euo pipefail
          for flag in -u -U; do
            status=0
            /usr/bin/pgrep -a "$flag" cvsandbox || status=$?
            case "$status" in
              1) ;;
              0) echo "::error::a cvsandbox process survived (pgrep $flag, listed above)"; exit 1 ;;
              *) echo "::error::pgrep $flag cvsandbox failed (exit $status)"; exit 1 ;;
            esac
          done
          echo "No cvsandbox process left."

      - if: steps.paths.outputs.run == 'true'
        name: Verify content
        run: pnpm content:verify
        env: { CONTENT_VERIFY_SANDBOX_USER: cvsandbox }

      - if: steps.paths.outputs.run == 'true'
        name: No sandbox process survived content:verify
        shell: bash
        run: |
          set -euo pipefail
          for flag in -u -U; do
            status=0
            /usr/bin/pgrep -a "$flag" cvsandbox || status=$?
            case "$status" in
              1) ;;
              0) echo "::error::a cvsandbox process survived (pgrep $flag, listed above)"; exit 1 ;;
              *) echo "::error::pgrep $flag cvsandbox failed (exit $status)"; exit 1 ;;
            esac
          done
          echo "No cvsandbox process left."

      - if: steps.paths.outputs.run == 'true'
        name: Runner temp stayed off /tmp
        shell: bash
        run: |
          set -euo pipefail
          leftover="$(find /tmp -maxdepth 1 -user "$(id -u)" -name 'tsx-*' -print)"
          if [ -n "$leftover" ]; then
            echo "::error::tsx wrote to the shared /tmp (TMPDIR did not reach it): $leftover"; exit 1
          fi
          echo "No runner-owned tsx-* directory in /tmp."
